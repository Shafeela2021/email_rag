[project]
name = "email-rag"
version = "0.1.0"
description = "Gmail RAG using ChromaDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.190.0",
    "google-auth>=2.48.0",
    "google-auth-oauthlib>=1.2.4",
    "chromadb",
    "langchain-openai",
    "langchain-community",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.2.12",
    "gradio>=6.5.1",
    "langchain-text-splitters>=1.1.0",
    "bs4>=0.0.2",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.3",
    "langchain-ollama>=1.0.1",
    "deepeval>=3.8.4",
    "onnxruntime<1.24.0",
    "langdetect>=1.0.9",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
